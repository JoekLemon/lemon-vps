---
services:
  caddy:
    hostname: caddy
    build: ./caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    hostname: postgres
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    restart: unless-stopped
    volumes:
      - ./synapse/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${SYNAPSE_DB_USER}
      - POSTGRES_PASSWORD=${SYNAPSE_DB_PASSWORD}
      - POSTGRES_DB=${SYNAPSE_DB_NAME}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --lc-collate=C --lc-ctype=C
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SYNAPSE_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  synapse:
    hostname: synapse
    image: matrixdotorg/synapse:${SYNAPSE_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./synapse/data:/data
      - ./synapse/homeserver.yaml:/data/homeserver.yaml:ro
    environment:
      - SYNAPSE_SERVER_NAME=${MATRIX_SERVER_NAME}
      - SYNAPSE_REPORT_STATS=no
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:8008/_matrix/client/versions || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nextcloud:
    hostname: nextcloud
    image: nextcloud:${NEXTCLOUD_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./nextcloud/data:/var/www/html
      - ./nextcloud/custom.config.php:/var/www/html/config/custom.config.php:ro
      - ${SYSTEM_USER_HOME}/Documents:/mnt/user-data/Documents:rw
      - ${SYSTEM_USER_HOME}/Music:/mnt/user-data/Music:rw
      - ${SYSTEM_USER_HOME}/Videos:/mnt/user-data/Videos:rw
      - ${SYSTEM_USER_HOME}/Pictures:/mnt/user-data/Pictures:rw
    environment:
      - NEXTCLOUD_ADMIN_USER=${ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${ADMIN_PASS}
      - NEXTCLOUD_TRUSTED_DOMAINS=https://cloud.${DOMAIN}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${NEXTCLOUD_DB_NAME}
      - POSTGRES_USER=${NEXTCLOUD_DB_USER}
      - POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:80/status.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  redis:
    hostname: redis
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  gitea:
    hostname: gitea
    image: gitea/gitea:${GITEA_VERSION:-latest}
    restart: unless-stopped
    volumes:
      - ./gitea/data:/data
      - ./gitea/app.ini:/data/gitea/conf/app.ini
    environment:
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__ROOT_URL=https://git.${DOMAIN}
      - GITEA__server__DOMAIN=${DOMAIN}
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__service__DISABLE_REGISTRATION=false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:3000/api/v1/version || wget -qO- http://localhost:3000/api/v1/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  gitea-runner:
    hostname: gitea-runner
    image: gitea/act_runner:${GITEA_RUNNER_VERSION:-latest}
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./gitea-runner/config.yaml:/config.yaml:ro
      - gitea-runner-data:/data
    environment:
      - GITEA_INSTANCE_URL=http://gitea:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_REGISTRATION_TOKEN:-}
    depends_on:
      gitea:
        condition: service_healthy

  icecast:
    hostname: icecast
    image: ghcr.io/jee-r/icecast:${ICECAST_VERSION:-latest}
    restart: unless-stopped
    profiles:
      - icecast
    ports:
      - "8000:8000"
    volumes:
      - ./icecast/icecast.xml:/config/icecast.xml:ro
      - ${QBIT_SAVE_PATH:-/home/lemon/Music}:/music:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:8000/status.xsl || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ices:
    hostname: ices
    build: ./ices
    restart: unless-stopped
    profiles:
      - icecast
    volumes:
      - ${QBIT_SAVE_PATH:-/home/lemon/Music}:/music:ro
    environment:
      - ICECAST_SOURCE_PASS=${ICECAST_SOURCE_PASS:-hackme}
    depends_on:
      icecast:
        condition: service_healthy

  qbittorrent:
    hostname: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:${QBITTORRENT_VERSION:-latest}
    restart: unless-stopped
    environment:
      - PUID=${SYSTEM_USER_UID:-1000}
      - PGID=${SYSTEM_USER_GID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
    volumes:
      - ./qbittorrent/config:/config
      - ./qbittorrent/qBittorrent.conf:/config/qBittorrent/qBittorrent.conf
      - ${QBIT_SAVE_PATH:-/home/lemon/Music}:/downloads
      - ${SYSTEM_USER_HOME}/Documents:/user/Documents:rw
      - ${SYSTEM_USER_HOME}/Videos:/user/Videos:rw
      - ${SYSTEM_USER_HOME}/Pictures:/user/Pictures:rw
      - ${SYSTEM_USER_HOME}/Downloads:/user/Downloads:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  ntfy:
    hostname: ntfy
    image: binwiederhier/ntfy:${NTFY_VERSION:-latest}
    restart: unless-stopped
    command: serve
    volumes:
      - ./ntfy/data:/var/cache/ntfy
      - ./ntfy/config:/etc/ntfy:ro
    environment:
      - NTFY_BASE_URL=https://ntfy.${DOMAIN}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:80/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  canary-redis:
    hostname: canary-redis
    image: redis:7-alpine
    restart: unless-stopped
    profiles:
      - canarytokens
    volumes:
      - ./canarytokens/redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  canary-frontend:
    hostname: canary-frontend
    image: thinkst/canarytokens:${CANARYTG_VERSION:-latest}
    restart: unless-stopped
    command: bash -c "cd frontend; uv run --no-sync python -m uvicorn app:app --host 0.0.0.0 --port 8082"
    profiles:
      - canarytokens
    volumes:
      - ./canarytokens/frontend.env:/srv/frontend/frontend.env:ro
      - ./canarytokens/uploads:/uploads/
    depends_on:
      canary-redis:
        condition: service_healthy

  canary-switchboard:
    hostname: canary-switchboard
    image: thinkst/canarytokens:${CANARYTG_VERSION:-latest}
    restart: unless-stopped
    command: bash -c "cd switchboard; rm -f switchboard.pid; uv run --no-sync twistd -noy switchboard.tac --pidfile=switchboard.pid"
    profiles:
      - canarytokens
    ports:
      - "51821:51820/udp"
      - "5354:5354/tcp"
      - "5354:5354/udp"
      - "2500:2500/tcp"
      - "3306:3306/tcp"
    volumes:
      - ./canarytokens/frontend.env:/srv/frontend/frontend.env:ro
      - ./canarytokens/switchboard.env:/srv/switchboard/switchboard.env:ro
      - ./canarytokens/uploads:/uploads/
    depends_on:
      canary-redis:
        condition: service_healthy

volumes:
  gitea-runner-data:
