# Hardened ClamAV Daemon Configuration
# Generated by lemon-vps

# === Socket & User Settings ===
LocalSocket /var/run/clamav/clamd.ctl
FixStaleSocket yes
LocalSocketGroup clamav
LocalSocketMode 660
User clamav

# === Scanning Behavior ===
ScanMail yes
ScanArchive yes
ArchiveBlockEncrypted yes
MaxDirectoryRecursion 15
FollowDirectorySymlinks no
FollowFileSymlinks no
ReadTimeout 180

# === Performance & Threading ===
MaxThreads 12
MaxConnectionQueueLength 15
IdleTimeout 30
MaxQueue 100

# === Logging ===
LogSyslog yes
LogRotate yes
LogFacility LOG_LOCAL6
LogClean no
LogVerbose yes
LogFile /var/log/clamav/clamav.log
LogTime yes
LogFileUnlock no
LogFileMaxSize 100M

# === Database ===
DatabaseDirectory /var/lib/clamav
OfficialDatabaseOnly yes
SelfCheck 3600

# === Detection Settings ===
ScanPE yes
MaxEmbeddedPE 10M
ScanOLE2 yes
ScanPDF yes
ScanHTML yes
MaxHTMLNormalize 10M
MaxHTMLNoTags 2M
MaxScriptNormalize 5M
MaxZipTypeRcg 1M
ScanSWF yes
ScanELF yes
PhishingSignatures yes
PhishingScanURLs yes
PhishingAlwaysBlockSSLMismatch yes
PhishingAlwaysBlockCloak yes
DetectPUA yes
OLE2BlockMacros yes
HeuristicScanPrecedence no
StructuredDataDetection no

# === Limits & Timeouts ===
MaxScanTime 120000
MaxScanSize 50M
MaxFileSize 10M
MaxRecursion 10
MaxFiles 5000
MaxPartitions 50
MaxIconsPE 100
PCREMatchLimit 10000
PCRERecMatchLimit 2000
PCREMaxFileSize 25M
StreamMaxLength 10M
OnAccessMaxFileSize 5M

# === Bytecode Settings ===
Bytecode yes
BytecodeSecurity TrustSigned
BytecodeTimeout 60000

# === On-Access Scanning ===
ScanOnAccess yes
OnAccessIncludePath /home
OnAccessPrevention yes
OnAccessExcludeUname clamav
OnAccessExcludeRootUID no

# === Exclusions ===
# Virtual File Systems
OnAccessExcludePath /proc
OnAccessExcludePath /sys
OnAccessExcludePath /dev
OnAccessExcludePath /run
OnAccessExcludePath /tmp

# Docker — scanning container internals causes performance issues
OnAccessExcludePath /var/lib/docker
OnAccessExcludePath /var/lib/containerd

# ClamAV own files — prevent recursive scanning
OnAccessExcludePath /var/log/clamav
OnAccessExcludePath /var/lib/clamav

# System directories
OnAccessExcludePath /boot
OnAccessExcludePath /snap

# === Other Options ===
ExitOnOOM yes
LeaveTemporaryFiles no
AlgorithmicDetection yes
CrossFilesystems no
ExtendedDetectionInfo yes
AllowAllMatchScan yes
ForceToDisk no
DisableCertCheck no
DisableCache no
