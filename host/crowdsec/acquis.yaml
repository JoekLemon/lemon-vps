# CrowdSec Acquisition Configuration
# lemon-vps — tells CrowdSec which logs to watch

---
# SSH (auth.log)
filenames:
  - /var/log/auth.log
labels:
  type: syslog
---
# Caddy access logs (JSON format)
filenames:
  - {{SRC_DIR}}/docker/caddy/data/access.log
labels:
  type: caddy
---
# Gitea logs
filenames:
  - {{SRC_DIR}}/docker/gitea/data/gitea/log/gitea.log
labels:
  type: gitea
